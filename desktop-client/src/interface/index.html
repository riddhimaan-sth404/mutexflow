<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B AI Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
      <header class="header">
        <h1>MutexFlow Enterprise</h1>
        <span class="badge">Enterprise</span>
      </header>

    <section class="controls">
      <div class="field-row">
        <label for="licenseKey">License Key</label>
        <input type="text" id="licenseKey" placeholder="Enter your license key" spellcheck="false">
      </div>
      <div class="field-row">
        <label for="inferenceMode">Inference Mode</label>
        <select id="inferenceMode">
          <option value="standard" selected>Cloud Standard (Instant Centralized Luxury)</option>
          <option value="local">Local Core (Offline Infrastructure)</option>
          <option value="byok">Cloud BYOK (Wholesale Key Control)</option>
        </select>
      </div>
      <div class="field-row hidden" id="byokKeyRow">
        <label for="byokKey">User OpenRouter Key</label>
        <input type="password" id="byokKey" placeholder="sk-or-v1-..." spellcheck="false">
      </div>
      <div class="field-row">
        <label for="workflowType">Workflow Type</label>
        <select id="workflowType">
          <option value="data_extraction">Extract Data (JSON)</option>
          <option value="professional_drafting">Draft Communication</option>
          <option value="general_reasoning" selected>General Analysis</option>
        </select>
      </div>
      <div class="field-row">
        <label for="taskComplexity">Complexity</label>
        <select id="taskComplexity">
          <option value="low">Low — Quick lookups</option>
          <option value="medium" selected>Medium — Standard agent</option>
          <option value="high">High — Deep analysis</option>
          <option value="reasoning">Reasoning — Complex logic</option>
        </select>
      </div>
    </section>

    <section class="integrations-hub">
      <div class="hub-header">
        <span class="hub-title">Enterprise Integration Hub</span>
        <input type="text" id="hubSearch" class="hub-search" placeholder="Filter integrations..." spellcheck="false">
      </div>

      <div class="hub-grid" id="integrationsHub">

        <div class="hub-category">
          <span class="hub-category-title">Communications</span>
          <div class="hub-category-cards">
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="slack">
                <span class="integ-card-name">Slack</span>
              </label>
              <button class="auth-btn" data-provider="slack">Connect</button>
              <span id="status-slack" class="auth-status">Not connected</span>
            </div>
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="microsoft">
                <span class="integ-card-name">Microsoft Teams</span>
              </label>
              <button class="auth-btn" data-provider="microsoft">Connect</button>
              <span id="status-microsoft" class="auth-status">Not connected</span>
            </div>
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="gmail">
                <span class="integ-card-name">Gmail</span>
              </label>
              <button class="auth-btn" data-provider="google">Connect</button>
              <span id="status-gmail" class="auth-status">Not connected</span>
            </div>
          </div>
        </div>

        <div class="hub-category">
          <span class="hub-category-title">Knowledge &amp; Data</span>
          <div class="hub-category-cards">
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="google_sheets">
                <span class="integ-card-name">Google Sheets</span>
              </label>
              <button class="auth-btn" data-provider="google">Connect</button>
              <span id="status-google_sheets" class="auth-status">Not connected</span>
            </div>
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="notion">
                <span class="integ-card-name">Notion</span>
              </label>
              <button class="auth-btn" data-provider="notion">Connect</button>
              <span id="status-notion" class="auth-status">Not connected</span>
            </div>
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="confluence">
                <span class="integ-card-name">Confluence</span>
              </label>
              <button class="auth-btn" data-provider="confluence">Connect</button>
              <span id="status-confluence" class="auth-status">Not connected</span>
            </div>
          </div>
        </div>

        <div class="hub-category">
          <span class="hub-category-title">Engineering &amp; Product</span>
          <div class="hub-category-cards">
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="github">
                <span class="integ-card-name">GitHub</span>
              </label>
              <button class="auth-btn" data-provider="github">Connect</button>
              <span id="status-github" class="auth-status">Not connected</span>
            </div>
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="jira">
                <span class="integ-card-name">Jira</span>
              </label>
              <button class="auth-btn" data-provider="jira">Connect</button>
              <span id="status-jira" class="auth-status">Not connected</span>
            </div>
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="linear">
                <span class="integ-card-name">Linear</span>
              </label>
              <button class="auth-btn" data-provider="linear">Connect</button>
              <span id="status-linear" class="auth-status">Not connected</span>
            </div>
          </div>
        </div>

        <div class="hub-category">
          <span class="hub-category-title">CRM &amp; Sales</span>
          <div class="hub-category-cards">
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="salesforce">
                <span class="integ-card-name">Salesforce</span>
              </label>
              <button class="auth-btn" data-provider="salesforce">Connect</button>
              <span id="status-salesforce" class="auth-status">Not connected</span>
            </div>
            <div class="integ-card">
              <label class="integ-card-checkbox-label">
                <input type="checkbox" class="integ-card-checkbox" value="hubspot">
                <span class="integ-card-name">HubSpot</span>
              </label>
              <button class="auth-btn" data-provider="hubspot">Connect</button>
              <span id="status-hubspot" class="auth-status">Not connected</span>
            </div>
          </div>
        </div>

      </div>
    </section>

    <section class="local-ai-section">
      <button id="localAiToggle" class="local-ai-toggle">Local AI Hub</button>
      <div id="localAiPanel" class="local-ai-panel hidden">
        <div class="model-select-row">
          <select id="localModelSelect">
            <option value="" disabled selected>Select a GGUF model to download...</option>
            <option value="lmstudio-community/Meta-Llama-3.1-8B-Instruct-GGUF/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
              data-repo="lmstudio-community/Meta-Llama-3.1-8B-Instruct-GGUF"
              data-file="Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf">
              Llama 3.1 8B Instruct (Q4_K_M) - Balanced &amp; Highly Capable
            </option>
            <option value="unsloth/DeepSeek-R1-Distill-Llama-8B-GGUF/DeepSeek-R1-Distill-Llama-8B-Q4_K_M.gguf"
              data-repo="unsloth/DeepSeek-R1-Distill-Llama-8B-GGUF"
              data-file="DeepSeek-R1-Distill-Llama-8B-Q4_K_M.gguf">
              DeepSeek R1 Distill Llama 8B (Q4_K_M) - Advanced Reasoning
            </option>
            <option value="Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
              data-repo="Qwen/Qwen2.5-Coder-7B-Instruct-GGUF"
              data-file="qwen2.5-coder-7b-instruct-q4_k_m.gguf">
              Qwen 2.5 Coder 7B Instruct (Q4_K_M) - Elite Programming Engine
            </option>
            <option value="lmstudio-community/Phi-3.5-mini-instruct-GGUF/Phi-3.5-mini-instruct-Q4_K_M.gguf"
              data-repo="lmstudio-community/Phi-3.5-mini-instruct-GGUF"
              data-file="Phi-3.5-mini-instruct-Q4_K_M.gguf">
              Phi-3.5 Mini Instruct (Q4_K_M) - Ultra-Fast &amp; Lightweight
            </option>
            <option value="maziyarpanahi/Mistral-7B-Instruct-v0.3-GGUF/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf"
              data-repo="maziyarpanahi/Mistral-7B-Instruct-v0.3-GGUF"
              data-file="Mistral-7B-Instruct-v0.3-Q4_K_M.gguf">
              Mistral 7B Instruct v0.3 (Q4_K_M) - Diverse General Productivity
            </option>
          </select>
          <button id="downloadModelBtn">Download and Setup</button>
        </div>
        <div class="download-progress-container">
          <div class="download-progress-track">
            <div id="downloadProgressBar" class="download-progress-bar"></div>
          </div>
          <span id="downloadStatusText"></span>
        </div>
      </div>
    </section>

    <section class="prompt-section">
      <label for="promptInput">Command / Prompt</label>
      <textarea id="promptInput" placeholder="Enter automation command or data..."></textarea>
    </section>

    <section class="actions">
      <button id="executeBtn">Run Agent</button>
      <div id="spinner" class="spinner hidden"></div>
    </section>

    <section class="output-section">
      <div class="output-header">
        <span>Output / Log</span>
        <button id="clearBtn">Clear</button>
      </div>
      <pre id="logOutput"></pre>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
