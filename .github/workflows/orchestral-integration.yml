name: MutexFlow + Orchestral integration checks

on:
  push:
    branches:
      - "integration/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mutexflow-backend:
    name: MutexFlow Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test backend
        run: cargo test --manifest-path backend-rust/Cargo.toml

  orchestral-core:
    name: Orchestral Citadel core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Citadel
        run: cargo test --manifest-path orchestral-runtime/core/Cargo.toml

  orchestral-worker:
    name: Orchestral Python worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker
        run: python -m pip install -e ./orchestral-runtime/worker
      - name: Check Python syntax
        run: python -m compileall -q orchestral-runtime/worker/orchestral_worker
      - name: Run guard unit tests
        run: |
          python -m unittest discover -s orchestral-runtime/tests -p "test_unit_guards.py" -v
          python -m unittest discover -s orchestral-runtime/tests -p "test_mutexflow_worker_service.py" -v

  mutexflow-desktop:
    name: MutexFlow Avalonia desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build desktop
        run: dotnet build desktop-avalonia/MutexFlow.Desktop.csproj --configuration Release

  windows-smoke:
    name: Windows integration smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test MutexFlow backend
        run: cargo test --manifest-path backend-rust/Cargo.toml
      - name: Test Orchestral Citadel
        run: cargo test --manifest-path orchestral-runtime/core/Cargo.toml
      - name: Build Avalonia desktop
        run: dotnet build desktop-avalonia/MutexFlow.Desktop.csproj --configuration Release
      - name: Install Python worker
        run: python -m pip install -e ./orchestral-runtime/worker
      - name: Test Python worker boundaries
        shell: pwsh
        run: |
          python -m unittest discover -s orchestral-runtime/tests -p "test_unit_guards.py" -v
          python -m unittest discover -s orchestral-runtime/tests -p "test_mutexflow_worker_service.py" -v

  managed-runtime-e2e:
    name: Managed Orchestral runtime end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build MutexFlow backend
        run: cargo build --manifest-path backend-rust/Cargo.toml
      - name: Start managed runtime and exercise backend APIs
        shell: bash
        run: |
          set -euo pipefail
          export ORCHESTRAL_ADMIN_KEY="orch_live_ci_test_key_7f31d4e8a5c2"
          export ORCHESTRAL_JWT_SECRET="ci-only-jwt-secret-not-for-production-000000000000000000000000"
          export ORCHESTRAL_AUTOSTART=true
          export ORCHESTRAL_CORE_URL="http://127.0.0.1:8088"
          export ORCHESTRAL_WORKER_URL="http://127.0.0.1:8090"
          export PYTHON=python3
          export BIND_ADDR=127.0.0.1
          export PORT=3001

          ./backend-rust/target/debug/backend-rust > "$RUNNER_TEMP/mutexflow-backend.log" 2>&1 &
          BACKEND_PID=$!
          trap 'kill -INT "$BACKEND_PID" 2>/dev/null || true; wait "$BACKEND_PID" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          curl --fail --silent http://127.0.0.1:3001/api/v1/orchestral/status             | python -c 'import json,sys; d=json.load(sys.stdin); assert d["core_healthy"], d; assert d["worker_healthy"], d'

          job_json=$(curl --fail --silent -X POST http://127.0.0.1:3001/api/v1/orchestral/jobs/local-analysis             -H "Content-Type: application/json" -d '{"workspace":"backend-rust"}')
          job_id=$(printf '%s' "$job_json" | python -c 'import json,sys; print(json.load(sys.stdin)["job_id"])')
          for _ in $(seq 1 90); do
            job_json=$(curl --fail --silent "http://127.0.0.1:3001/api/v1/orchestral/jobs/$job_id")
            job_status=$(printf '%s' "$job_json" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            if [ "$job_status" = "completed" ]; then break; fi
            if [ "$job_status" = "failed" ] || [ "$job_status" = "cancelled" ]; then
              echo "$job_json"
              exit 1
            fi
            sleep 1
          done
          test "$job_status" = "completed"

          curl --fail --silent http://127.0.0.1:3001/api/v1/orchestral/agents             | python -c 'import json,sys; assert isinstance(json.load(sys.stdin), list)'
          curl --fail --silent http://127.0.0.1:3001/api/v1/orchestral/findings             | python -c 'import json,sys; assert isinstance(json.load(sys.stdin), list)'

          hitl_json=$(curl --fail --silent -X POST http://127.0.0.1:8088/api/v1/hitl/pending             -H "X-Orchestral-API-Key: $ORCHESTRAL_ADMIN_KEY"             -H "Content-Type: application/json"             -d '{"agent_id":"ci-approval-agent","tool_name":"manual-review","target":"local-workspace","command_preview":"CI approval-gate verification","risk_tier":"active"}')
          approval_id=$(printf '%s' "$hitl_json" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl --fail --silent "http://127.0.0.1:3001/api/v1/orchestral/approvals/$approval_id/deny" -X POST             | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "denied"'
          curl --fail --silent http://127.0.0.1:3001/api/v1/orchestral/audit?limit=20             | python -c 'import json,sys; assert isinstance(json.load(sys.stdin), list)'
