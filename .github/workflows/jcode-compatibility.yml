name: JCode upstream compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/jcode-compatibility.yml"
      - "JCODE_INTEGRATION.md"
      - "backend-rust/**"
      - "orchestral-runtime/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JCODE_UPSTREAM_SHA: 72f9c07ff59639221b9f371b759f784416bd1d12
  # Upstream's optional wrapper is a POSIX script; disable it for native CI shells.
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  linux-sdk-contract:
    name: JCode SDK and Harness API (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MutexFlow
        uses: actions/checkout@v4
      - name: Checkout pinned JCode source
        uses: actions/checkout@v4
        with:
          repository: 1jehuang/jcode
          ref: ${{ env.JCODE_UPSTREAM_SHA }}
          path: jcode-upstream
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test versioned API and SDK
        working-directory: jcode-upstream
        run: cargo check --locked -p jcode-harness-api -p jcode-harness-api-server -p jcode-sdk && cargo test --locked -p jcode-sdk

  isolated-runtime-smoke:
    name: Isolated JCode runtime smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MutexFlow
        uses: actions/checkout@v4
      - name: Checkout pinned JCode source
        uses: actions/checkout@v4
        with:
          repository: 1jehuang/jcode
          ref: ${{ env.JCODE_UPSTREAM_SHA }}
          path: jcode-upstream
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build headless JCode runtime
        working-directory: jcode-upstream
        run: cargo build --locked --release --no-default-features --bin jcode
      - name: Exercise isolated backend lifecycle
        env:
          JCODE_RUNTIME_SMOKE: "1"
          JCODE_AUTOSTART: "true"
          JCODE_BINARY: ${{ github.workspace }}/jcode-upstream/target/release/jcode
        run: cargo test --manifest-path backend-rust/Cargo.toml --test jcode_runtime_smoke -- --nocapture

  windows-sdk-contract:
    name: JCode SDK and Harness API (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout MutexFlow
        uses: actions/checkout@v4
      - name: Checkout pinned JCode source
        uses: actions/checkout@v4
        with:
          repository: 1jehuang/jcode
          ref: ${{ env.JCODE_UPSTREAM_SHA }}
          path: jcode-upstream
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test versioned API and SDK
        working-directory: jcode-upstream
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: cargo check --locked -p jcode-harness-api -p jcode-harness-api-server -p jcode-sdk && cargo test --locked -p jcode-sdk -- --skip worktrees::tests::lists_existing_detached_locked_prunable_and_bare_worktrees --skip worktrees::tests::creation_isolates_dirty_edits_and_nested_invocation --skip worktrees::tests::rejects_invalid_branches_collisions_and_non_repositories
